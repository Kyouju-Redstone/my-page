<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>きょうじゅのページ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="page">

        <header class="profile">
            <div class="profile__avatar-wrap">
                <img class="profile__avatar" src="./image/icon_kyouju.png" alt="きょうじゅのアイコン">
            </div>
            <div class="profile__text">
                <h1 class="profile__name">きょうじゅ</h1>
                <p class="profile__bio">
                    Minecraftで回路勢をやっています。<br>
                    Java版・統合版(BE)で主にドアや隠し階段を開発しています。
                </p>
            </div>
        </header>

        <div class="divider" aria-hidden="true"><span class="divider__node"></span></div>

        <section class="links">
            <p class="links__eyebrow"><span class="links__dot"></span>各サイトリンク</p>

            <div class="links__grid">
                <a class="link-block" href="https://www.youtube.com/channel/UCSEHp5ofON6BieaIr_z3MQw/" target="_blank" rel="noopener">
                    <img class="link-block__icon" src="./image/icon_youtube.png" alt="">
                    <h2 class="link-block__title">YouTube</h2>
                    <p class="link-block__desc">主な活動場所です。</p>
                </a>

                <a class="link-block" href="https://twitter.com/Kyouju_Redstone" target="_blank" rel="noopener">
                    <img class="link-block__icon" src="./image/icon_twitter.png" alt="">
                    <h2 class="link-block__title">Twitter</h2>
                    <p class="link-block__desc">適当なこと呟いています。</p>
                </a>

                <a class="link-block" href="https://www.nicovideo.jp/user/46785972/video?ref=pc_userpage_menu" target="_blank" rel="noopener">
                    <img class="link-block__icon" src="./image/icon_niconico.png" alt="">
                    <h2 class="link-block__title">ニコニコ動画</h2>
                    <p class="link-block__desc"></p>
                </a>

                <a class="link-block" href="https://space.bilibili.com/1100225576" target="_blank" rel="noopener">
                    <img class="link-block__icon" src="./image/bilibili_icon.png" alt="">
                    <h2 class="link-block__title">bilibili</h2>
                    <p class="link-block__desc">中国の動画サイト。<br>Showcaseビデオを主に投稿しています。</p>
                </a>

                <a class="link-block" href="https://ux.getuploader.com/kyouju_Minecraft/" target="_blank" rel="noopener">
                    <img class="link-block__icon" src="./image/uploaderjp_icon.png" alt="">
                    <h2 class="link-block__title">uploader.jp</h2>
                    <p class="link-block__desc">回路の配布ワールドを置いています。</p>
                </a>

                <a class="link-block" href="https://github.com/Kyouju-Redstone" target="_blank" rel="noopener">
                    <img class="link-block__icon" src="./image/icon_github.png" alt="">
                    <h2 class="link-block__title">GitHub</h2>
                    <p class="link-block__desc"></p>
                </a>
            </div>
        </section>

        <footer class="footer">© きょうじゅ</footer>

    </div>
</body>

</html>
